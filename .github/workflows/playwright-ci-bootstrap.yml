name: Playwright CI Bootstrap

on:
  push:
    branches: [test/playwright-e2e-gate]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/playwright-e2e-gate
      - name: Add E2E job to unified CI gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          if '\n  e2e:\n' not in text:
              marker = '\n  containers:\n'
              job = r'''

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://zhituo:zhituo@127.0.0.1:5432/zhituo
      DATABASE_RLS_ENABLED: "true"
      JOB_MODE: queue
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "true"
      ALLOW_DEMO_FALLBACK: "false"
      AUTH_MODE: development_header
      DEV_USER_EMAIL: admin@zhituo.local
      API_BASE_URL: http://127.0.0.1:8000
      API_AUTH_MODE: development_header
      NEXT_PUBLIC_ALLOW_DEMO_FALLBACK: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_USER_EMAIL: admin@zhituo.local
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhituo
          POSTGRES_USER: zhituo
          POSTGRES_PASSWORD: zhituo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhituo -d zhituo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install uv and locked API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
          cd apps/api
          uv sync --locked --extra dev
      - name: Prepare real PostgreSQL demo data
        run: |
          cd apps/api
          uv run alembic upgrade head
          uv run zhituo-api seed
      - name: Start FastAPI for browser E2E
        run: |
          cd apps/api
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/zhituo-api-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent -H 'X-Zhituo-User: admin@zhituo.local' http://127.0.0.1:8000/api/meta >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhituo-api-e2e.log
          exit 1
      - name: Install locked Web dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start Next.js production server
        run: |
          npm --workspace apps/web run build
          nohup npm --workspace apps/web run start -- --hostname 127.0.0.1 --port 3000 > /tmp/zhituo-web-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent -H 'X-Zhituo-User: admin@zhituo.local' http://127.0.0.1:3000/pursuit >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhituo-web-e2e.log
          exit 1
      - name: Run Playwright Pursuit golden path
        run: npm --workspace apps/web run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/zhituo-api-e2e.log
            /tmp/zhituo-web-e2e.log
          if-no-files-found: warn
          retention-days: 7
'''
              text = text.replace(marker, job + marker, 1)

          text = text.replace(
              'needs: [web, api, containers, security]',
              'needs: [web, api, e2e, containers, security]',
          )
          text = text.replace(
              '          API_RESULT: ${{ needs.api.result }}\n',
              '          API_RESULT: ${{ needs.api.result }}\n          E2E_RESULT: ${{ needs.e2e.result }}\n',
          )
          text = text.replace(
              '          test "$API_RESULT" = "success"\n',
              '          test "$API_RESULT" = "success"\n          test "$E2E_RESULT" = "success"\n',
          )
          path.write_text(text)
          PY
      - name: Commit unified CI gate
        run: |
          if git diff --quiet .github/workflows/ci.yml; then
            echo 'CI already contains Playwright gate.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'ci: require Playwright golden path'
          git push origin HEAD:test/playwright-e2e-gate
