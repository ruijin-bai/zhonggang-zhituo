name: Ruff Fix Pilot

on:
  push:
    branches:
      - feat/worldbank-real-pilot
    paths:
      - '.github/workflows/ruff-fix-pilot.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worldbank-real-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv and locked dependencies
        working-directory: apps/api
        run: |
          python -m pip install 'uv>=0.8,<1'
          uv sync --locked --extra dev
      - name: Apply Ruff import fix
        working-directory: apps/api
        run: uv run ruff check --fix tests/test_worldbank_procurement_connector.py
      - name: Commit exact Ruff fix
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_worldbank_procurement_connector.py
          git commit -m 'style: apply Ruff import ordering'
          git push origin HEAD:feat/worldbank-real-pilot
