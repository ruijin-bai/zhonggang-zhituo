name: Coverage Lock Bootstrap

on:
  push:
    branches: [chore/coverage-gate]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/coverage-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh API lock
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
          cd apps/api
          uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet apps/api/uv.lock; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/uv.lock
          git commit -m 'build: lock pytest coverage tooling'
          git push origin HEAD:chore/coverage-gate
