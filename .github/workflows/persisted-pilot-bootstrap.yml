name: Persisted Pilot Bootstrap

on:
  push:
    branches:
      - test/persisted-real-source-pilot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/persisted-real-source-pilot
      - name: Apply exact candidate metadata patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/app/candidate_pipeline.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    content_sha256: str\n    text_object_key: str\n',
                  '    content_sha256: str\n    text_object_key: str\n    connector_metadata: dict\n',
              ),
              (
                  '        content_sha256=document.content_sha256,\n        text_object_key=document.text_object_key,\n',
                  '        content_sha256=document.content_sha256,\n        text_object_key=document.text_object_key,\n        connector_metadata=document.connector_metadata,\n',
              ),
              (
                  '        discovery, mode = await service.discover_project(\n            document_text,\n            page_title=document.title,\n            use_ai=True,\n        )\n\n        # Re-enter a short locked transaction after the expensive external/model call.',
                  '        discovery, mode = await service.discover_project(\n            document_text,\n            page_title=document.title,\n            use_ai=True,\n        )\n        metadata_country = str(document.connector_metadata.get("country") or "").strip()\n        if discovery.country == "待识别" and metadata_country:\n            discovery = discovery.model_copy(update={"country": metadata_country})\n\n        # Re-enter a short locked transaction after the expensive external/model call.',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected patch anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/app/candidate_pipeline.py
          git diff --cached --check
          git commit -m "fix: propagate authoritative source country into candidates"
          git push
