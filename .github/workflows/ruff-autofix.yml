name: Ruff Autofix

on:
  push:
    branches: [chore/production-gates]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-gates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv and locked API dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
          cd apps/api
          uv sync --locked --extra dev
      - name: Apply Ruff safe fixes
        run: |
          cd apps/api
          uv run ruff check app tests --fix
      - name: Commit safe Ruff fixes
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'style: apply Ruff safe fixes'
          git push origin HEAD:chore/production-gates
