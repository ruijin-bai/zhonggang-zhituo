name: AfDB Browser Probe

on:
  push:
    branches:
      - test/real-gold-source-contract
    paths:
      - '.github/workflows/afdb-browser-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe one official AfDB document
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const url = 'https://www.afdb.org/en/documents/spn-gambia-rehabilitation-and-development-rice-irrigation-scheme-and-construction-access-feeder-roads-reward-gambia';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ locale: 'en-US' });
          const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
          console.log(`status=${response?.status() ?? 'none'}`);
          console.log(`final_url=${page.url()}`);
          console.log(`title=${await page.title()}`);
          const text = await page.locator('body').innerText();
          console.log(`chars=${text.length}`);
          console.log(`contains_reward=${text.toLowerCase().includes('reward')}`);
          console.log(`contains_irrigation=${text.toLowerCase().includes('irrigation')}`);
          await browser.close();
          if (!response || response.status() >= 400 || text.length < 200) process.exit(1);
          NODE
