name: Gold Source Provenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches:
      - test/real-gold-source-contract
    paths:
      - 'data/benchmark/gold_dataset*.json'
      - 'scripts/cache_gold_sources.py'
      - 'apps/api/app/gold_dataset.py'
      - 'apps/api/app/web_fetch.py'
      - 'apps/api/app/connectors/pdf.py'
      - '.github/workflows/gold-source-provenance.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
      - name: Install locked API dependencies
        working-directory: apps/api
        run: uv sync --locked --extra dev
      - name: Fetch and verify all Gold sources
        run: uv run --project apps/api python scripts/cache_gold_sources.py --refresh --require-all
      - name: Upload provenance manifest and source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-source-provenance-${{ github.sha }}
          path: data/benchmark/source_cache
          if-no-files-found: error
          retention-days: 14
