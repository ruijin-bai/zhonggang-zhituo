name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Web dependencies
        run: npm ci
      - run: npm --workspace apps/web run check
      - run: npm --workspace apps/web run build

  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://zhituo:zhituo@127.0.0.1:5432/zhituo
      DATABASE_RLS_ENABLED: "true"
      JOB_MODE: queue
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "true"
      ALLOW_DEMO_FALLBACK: "true"
      AUTH_MODE: development_header
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhituo
          POSTGRES_USER: zhituo
          POSTGRES_PASSWORD: zhituo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhituo -d zhituo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
      - name: Install locked API dependencies
        run: uv sync --locked --extra dev
      - name: Lint Python with Ruff
        run: |
          set -o pipefail
          uv run ruff check app tests 2>&1 | tee /tmp/ruff-report.txt
      - name: Upload Ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-${{ github.sha }}
          path: /tmp/ruff-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Compile Python sources
        run: uv run python -m compileall -q app
      - name: Validate operations shell scripts
        run: >-
          bash -n
          ../../ops/postgres/backup.sh
          ../../ops/postgres/restore.sh
          ../../scripts/configure-github-ruleset.sh
          ../../scripts/staging-up.sh
          ../../scripts/staging-smoke.sh
          ../../scripts/staging-down.sh
          ../../scripts/lib/pilot-common.sh
          ../../scripts/pilot-up.sh
          ../../scripts/pilot-down.sh
          ../../scripts/pilot-update.sh
          ../../scripts/pilot-health.sh
          ../../scripts/pilot-backup.sh
          ../../scripts/pilot-restore.sh
          ../../scripts/pilot-logs.sh
          ../../scripts/pilot-real-source.sh
          ../../scripts/oci-free-preflight.sh
          ../../scripts/oracle-pilot-bootstrap.sh
      - name: Apply database migrations on clean PostgreSQL
        run: uv run alembic upgrade head
      - name: Verify latest migration downgrade and re-upgrade
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: Provision and verify least-privilege database roles
        env:
          PGPASSWORD: zhituo
        run: |
          psql -h 127.0.0.1 -U zhituo -d zhituo \
            --set=database_name=zhituo \
            --set=runtime_role=zhituo_ci_runtime \
            --set=runtime_password='ci-runtime-password-123456789' \
            --set=backup_role=zhituo_ci_backup \
            --set=backup_password='ci-backup-password-123456789' \
            -f ../../ops/postgres/provision_runtime_role.sql
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='zhituo_ci_runtime'")" = "f"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='zhituo_ci_backup'")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_runtime','background_jobs','INSERT')")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_runtime','pursuit_work_items','INSERT')")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_runtime','pursuit_decision_records','INSERT')")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_backup','background_jobs','INSERT')")" = "f"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_backup','pursuit_work_items','INSERT')")" = "f"
      - name: Verify Redis connectivity
        run: uv run python -c "from redis import Redis; assert Redis.from_url('redis://127.0.0.1:6379/0').ping()"
      - name: Run unit, integration and PostgreSQL RLS tests with coverage
        run: >-
          uv run pytest -q
          --cov=app
          --cov-report=term-missing
          --cov-report=json:/tmp/coverage.json
          --cov-fail-under=69
      - name: Upload API coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.sha }}
          path: /tmp/coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify repeatable demo seed and CLI
        run: |
          uv run zhituo-api reset-demo
          uv run zhituo-api status
      - name: Exercise PostgreSQL backup and restore to isolated database
        env:
          PGPASSWORD: zhituo
        run: |
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"
          test "$(pg_restore --version | awk '{print $3}' | cut -d. -f1)" = "17"
          rm -rf /tmp/zhituo-backup-ci
          DATABASE_URL='postgresql://zhituo:zhituo@127.0.0.1:5432/zhituo' \
            BACKUP_DIR=/tmp/zhituo-backup-ci \
            RETENTION_DAYS=0 \
            bash ../../ops/postgres/backup.sh
          BACKUP_FILE="$(find /tmp/zhituo-backup-ci -name 'zhituo-*.dump' -type f | head -n 1)"
          test -n "$BACKUP_FILE"
          dropdb --if-exists -h 127.0.0.1 -U zhituo zhituo_restore_ci
          createdb -h 127.0.0.1 -U zhituo zhituo_restore_ci
          TARGET_DATABASE_URL='postgresql://zhituo:zhituo@127.0.0.1:5432/zhituo_restore_ci' \
            BACKUP_FILE="$BACKUP_FILE" \
            CONFIRM_RESTORE=YES \
            bash ../../ops/postgres/restore.sh
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo_restore_ci -Atc 'SELECT count(*) FROM opportunities')" -gt 0

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://zhituo:zhituo@127.0.0.1:5432/zhituo
      DATABASE_RLS_ENABLED: "true"
      JOB_MODE: queue
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "true"
      ALLOW_DEMO_FALLBACK: "false"
      AUTH_MODE: development_header
      DEV_USER_EMAIL: admin@zhituo.local
      API_BASE_URL: http://127.0.0.1:8000
      API_AUTH_MODE: development_header
      NEXT_PUBLIC_ALLOW_DEMO_FALLBACK: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_USER_EMAIL: admin@zhituo.local
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhituo
          POSTGRES_USER: zhituo
          POSTGRES_PASSWORD: zhituo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhituo -d zhituo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install uv and locked API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
          cd apps/api
          uv sync --locked --extra dev
      - name: Prepare real PostgreSQL demo data
        run: |
          cd apps/api
          uv run alembic upgrade head
          uv run zhituo-api seed
      - name: Start FastAPI for browser E2E
        run: |
          cd apps/api
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/zhituo-api-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent -H 'X-Zhituo-User: admin@zhituo.local' http://127.0.0.1:8000/api/meta >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhituo-api-e2e.log
          exit 1
      - name: Install locked Web dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start Next.js production server
        run: |
          npm --workspace apps/web run build
          nohup npm --workspace apps/web run start -- --hostname 127.0.0.1 --port 3000 > /tmp/zhituo-web-e2e.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent -H 'X-Zhituo-User: admin@zhituo.local' http://127.0.0.1:3000/pursuit >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhituo-web-e2e.log
          exit 1
      - name: Run Playwright Pursuit golden path
        run: npm --workspace apps/web run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/zhituo-api-e2e.log
            /tmp/zhituo-web-e2e.log
          if-no-files-found: warn
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose topology
        run: |
          : > /tmp/zhituo-api.env
          : > /tmp/zhituo-web.env
          ZHITUO_API_IMAGE=zhituo-api:ci \
          ZHITUO_WEB_IMAGE=zhituo-web:ci \
          ZHITUO_API_ENV_FILE=/tmp/zhituo-api.env \
          ZHITUO_WEB_ENV_FILE=/tmp/zhituo-web.env \
          docker compose -f deploy/docker-compose.production.yml config --quiet
      - name: Validate staging Compose topology
        run: docker compose --env-file deploy/staging/.env.example -f deploy/staging/docker-compose.yml config --quiet
      - name: Build API production image
        run: docker build --pull -t zhituo-api:ci apps/api
      - name: Smoke import API production image
        run: docker run --rm --entrypoint python zhituo-api:ci -c "import app.main; print('api-import-ok')"
      - name: Build Web production image from locked workspace
        run: docker build --pull -f apps/web/Dockerfile -t zhituo-web:ci .
      - name: Prepare isolated CI staging environment
        run: |
          cat > /tmp/zhituo-staging.env <<'EOF'
          ZHITUO_API_IMAGE=zhituo-api:ci
          ZHITUO_WEB_IMAGE=zhituo-web:ci
          POSTGRES_PASSWORD=ci-staging-postgres-password
          MINIO_ROOT_USER=zhituo-ci
          MINIO_ROOT_PASSWORD=ci-staging-minio-password-123456
          STAGING_WEB_PORT=3001
          STAGING_POSTGRES_PORT=55432
          STAGING_SMTP_PORT=1025
          STAGING_MAILPIT_PORT=8025
          STAGING_MINIO_API_PORT=9000
          STAGING_MINIO_CONSOLE_PORT=9001
          CELERY_WORKER_CONCURRENCY=1
          EOF
      - name: Run full staging integration smoke
        env:
          ZHITUO_STAGING_ENV_FILE: /tmp/zhituo-staging.env
          ZHITUO_STAGING_SKIP_BUILD: "true"
        run: bash scripts/staging-up.sh
      - name: Clean isolated staging environment
        if: always()
        env:
          ZHITUO_STAGING_ENV_FILE: /tmp/zhituo-staging.env
          CONFIRM_PURGE: "YES"
        run: |
          if [ -f /tmp/zhituo-staging.env ]; then
            bash scripts/staging-down.sh --purge || true
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit locked Python runtime dependencies and generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1' 'pip-audit>=2.9,<3'
          cd apps/api
          uv sync --locked
          cd ../..
          pip-audit \
            --path apps/api/.venv/lib/python3.12/site-packages \
            --format cyclonedx-json \
            --output api-sbom.cdx.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit locked Web production dependencies
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Generate Web CycloneDX SBOM
        run: npm sbom --workspace apps/web --sbom-format cyclonedx > web-sbom.cdx.json
      - name: Upload software bills of materials and dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhituo-supply-chain-${{ github.sha }}
          path: |
            api-sbom.cdx.json
            web-sbom.cdx.json
            package-lock.json
            apps/api/uv.lock
          if-no-files-found: error
          retention-days: 30

  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Pilot configuration contract
        run: |
          cat > /tmp/zhituo-pilot.env <<'EOF'
          ZHITUO_API_IMAGE=zhituo-api:pilot-ci
          ZHITUO_WEB_IMAGE=zhituo-web:pilot-ci
          DEPLOYED_GIT_SHA=ci
          PREVIOUS_GIT_SHA=
          POSTGRES_OWNER_PASSWORD=ci-owner-strong-random-value-123456
          POSTGRES_RUNTIME_PASSWORD=ci-runtime-strong-random-value-123456
          POSTGRES_BACKUP_PASSWORD=ci-backup-strong-random-value-123456
          REDIS_PASSWORD=ci-redis-strong-random-value-123456
          MINIO_ROOT_USER=zhituo-pilot-ci
          MINIO_ROOT_PASSWORD=ci-minio-strong-random-value-123456
          AUTH_PROXY_SECRET=ci-proxy-strong-random-value-1234567890
          METRICS_TOKEN=ci-metrics-strong-random-value-1234567890
          MINIO_BUCKET=zhituo-pilot-documents
          PILOT_SECRETS_DIR=/tmp/zhituo-pilot-secrets
          PILOT_BACKUP_DIR=/tmp/zhituo-pilot-backups
          PILOT_BACKUP_RETENTION_DAYS=14
          PILOT_BIND_ADDRESS=127.0.0.1
          PILOT_HTTP_PORT=18080
          PILOT_BASIC_AUTH_USER=pilot
          PILOT_BASIC_AUTH_PASSWORD=ci-basic-auth-strong-value
          PILOT_BASIC_AUTH_HASH='$2a$14$S0M9yLbKf7p1QAvXKe5RpehknbOmF/0uO5fP91t51pSKStWDQDSuy'
          PILOT_ADMIN_EMAIL=pilot-ci@example.com
          PILOT_ADMIN_DISPLAY_NAME=Pilot CI
          PILOT_ORGANIZATION_NAME=Zhituo Pilot CI
          PILOT_ORGANIZATION_CODE=ZHITUO-PILOT-CI
          CELERY_WORKER_CONCURRENCY=1
          AUTHENTICATED_RATE_LIMIT_PER_MINUTE=300
          SOURCE_SCAN_MIN_INTERVAL_SECONDS=300
          LOG_LEVEL=INFO
          CLOUDFLARE_TUNNEL_TOKEN=
          EOF
      - name: Validate Pilot Compose topology and private service exposure
        run: |
          docker compose --env-file /tmp/zhituo-pilot.env -f deploy/pilot/docker-compose.yml config --quiet
          rendered="$(docker compose --env-file /tmp/zhituo-pilot.env -f deploy/pilot/docker-compose.yml config)"
          test "$(grep -c 'published:' <<<"$rendered")" = "1"
          grep -q 'host_ip: 127.0.0.1' <<<"$rendered"
          ! grep -Eq 'published: "?(3000|8000|5432|6379|9000|9001)"?' <<<"$rendered"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate Oracle Free Tier Terraform
        working-directory: infra/oracle-pilot
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Verify all Pilot infrastructure images publish linux/arm64
        run: |
          for image in \
            postgres:17-alpine \
            redis:8-alpine \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            caddy:2.10.2-alpine \
            cloudflare/cloudflared:2026.8.1 \
            alpine:3.22.1; do
            docker buildx imagetools inspect "$image" | grep -q 'linux/arm64'
          done
      - name: Build and import-smoke API on linux/arm64
        run: |
          docker buildx build --platform linux/arm64 --load -t zhituo-api:pilot-arm64 apps/api
          docker run --rm --platform linux/arm64 --entrypoint python zhituo-api:pilot-arm64 \
            -c "import app.main; print('pilot-api-arm64-ok')"
      - name: Build Web on linux/arm64
        run: >-
          docker buildx build
          --platform linux/arm64
          --load
          -f apps/web/Dockerfile
          -t zhituo-web:pilot-arm64
          .

  ci-gate:
    name: zhituo/ci-gate
    if: always()
    needs: [web, api, e2e, containers, security, pilot]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI gate
        env:
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PILOT_RESULT: ${{ needs.pilot.result }}
        run: |
          test "$WEB_RESULT" = "success"
          test "$API_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$CONTAINERS_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$PILOT_RESULT" = "success"
