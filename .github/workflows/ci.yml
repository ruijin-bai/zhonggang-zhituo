name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://zhituo:zhituo@127.0.0.1:5432/zhituo
      JOB_MODE: queue
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "true"
      ALLOW_DEMO_FALLBACK: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhituo
          POSTGRES_USER: zhituo
          POSTGRES_PASSWORD: zhituo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhituo -d zhituo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify dependency graph
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run unit and integration tests
        run: pytest -q
      - name: Apply database migrations on clean PostgreSQL
        run: alembic upgrade head
      - name: Verify Redis connectivity
        run: python -c "from redis import Redis; assert Redis.from_url('redis://127.0.0.1:6379/0').ping()"
      - name: Verify repeatable demo seed and CLI
        run: |
          zhituo-api reset-demo
          zhituo-api status
