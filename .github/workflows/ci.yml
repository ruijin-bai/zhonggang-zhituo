name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://zhituo:zhituo@127.0.0.1:5432/zhituo
      DATABASE_RLS_ENABLED: "true"
      JOB_MODE: queue
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "true"
      ALLOW_DEMO_FALLBACK: "true"
      AUTH_MODE: development_header
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhituo
          POSTGRES_USER: zhituo
          POSTGRES_PASSWORD: zhituo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhituo -d zhituo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify dependency graph
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Validate operations shell scripts
        run: bash -n ../../ops/postgres/backup.sh ../../ops/postgres/restore.sh
      - name: Apply database migrations on clean PostgreSQL
        run: alembic upgrade head
      - name: Verify latest migration downgrade and re-upgrade
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Provision and verify least-privilege database roles
        env:
          PGPASSWORD: zhituo
        run: |
          psql -h 127.0.0.1 -U zhituo -d zhituo \
            --set=database_name=zhituo \
            --set=runtime_role=zhituo_ci_runtime \
            --set=runtime_password='ci-runtime-password-123456789' \
            --set=backup_role=zhituo_ci_backup \
            --set=backup_password='ci-backup-password-123456789' \
            -f ../../ops/postgres/provision_runtime_role.sql
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='zhituo_ci_runtime'")" = "f"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='zhituo_ci_backup'")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_runtime','background_jobs','INSERT')")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_backup','background_jobs','INSERT')")" = "f"
      - name: Verify Redis connectivity
        run: python -c "from redis import Redis; assert Redis.from_url('redis://127.0.0.1:6379/0').ping()"
      - name: Run unit, integration and PostgreSQL RLS tests
        run: pytest -q
      - name: Verify repeatable demo seed and CLI
        run: |
          zhituo-api reset-demo
          zhituo-api status
      - name: Exercise PostgreSQL backup and restore to isolated database
        env:
          PGPASSWORD: zhituo
        run: |
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"
          test "$(pg_restore --version | awk '{print $3}' | cut -d. -f1)" = "17"
          rm -rf /tmp/zhituo-backup-ci
          DATABASE_URL='postgresql://zhituo:zhituo@127.0.0.1:5432/zhituo' \
            BACKUP_DIR=/tmp/zhituo-backup-ci \
            RETENTION_DAYS=0 \
            bash ../../ops/postgres/backup.sh
          BACKUP_FILE="$(find /tmp/zhituo-backup-ci -name 'zhituo-*.dump' -type f | head -n 1)"
          test -n "$BACKUP_FILE"
          dropdb --if-exists -h 127.0.0.1 -U zhituo zhituo_restore_ci
          createdb -h 127.0.0.1 -U zhituo zhituo_restore_ci
          TARGET_DATABASE_URL='postgresql://zhituo:zhituo@127.0.0.1:5432/zhituo_restore_ci' \
            BACKUP_FILE="$BACKUP_FILE" \
            CONFIRM_RESTORE=YES \
            bash ../../ops/postgres/restore.sh
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo_restore_ci -Atc 'SELECT count(*) FROM opportunities')" -gt 0

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose topology
        run: |
          : > /tmp/zhituo-api.env
          : > /tmp/zhituo-web.env
          ZHITUO_API_IMAGE=zhituo-api:ci \
          ZHITUO_WEB_IMAGE=zhituo-web:ci \
          ZHITUO_API_ENV_FILE=/tmp/zhituo-api.env \
          ZHITUO_WEB_ENV_FILE=/tmp/zhituo-web.env \
          docker compose -f deploy/docker-compose.production.yml config --quiet
      - name: Build API production image
        run: docker build --pull -t zhituo-api:ci apps/api
      - name: Smoke import API production image
        run: docker run --rm --entrypoint python zhituo-api:ci -c "import app.main; print('api-import-ok')"
      - name: Build Web production image
        run: docker build --pull -t zhituo-web:ci apps/web

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python runtime dependencies and generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          pip install ./apps/api
          pip install 'pip-audit>=2.9,<3'
          pip-audit --local --format cyclonedx-json --output api-sbom.cdx.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve, lock and audit Web production dependencies
        working-directory: apps/web
        run: |
          npm install --package-lock=true
          test -s package-lock.json
          npm audit --omit=dev --audit-level=high
      - name: Generate Web CycloneDX SBOM
        working-directory: apps/web
        run: npm sbom --sbom-format cyclonedx > ../../web-sbom.cdx.json
      - name: Upload software bills of materials and generated Web lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhituo-supply-chain-${{ github.sha }}
          path: |
            api-sbom.cdx.json
            web-sbom.cdx.json
            apps/web/package-lock.json
          if-no-files-found: warn
          retention-days: 30

  ci-gate:
    if: always()
    needs: [web, api, containers, security]
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$WEB_RESULT" = "success" ] && [ "$API_RESULT" = "success" ] && [ "$CONTAINERS_RESULT" = "success" ] && [ "$SECURITY_RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='web, api, containers and security passed'
          else
            STATE=failure
            DESCRIPTION="web=$WEB_RESULT api=$API_RESULT containers=$CONTAINERS_RESULT security=$SECURITY_RESULT"
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$(jq -nc --arg state "$STATE" --arg target_url "https://github.com/$REPOSITORY/actions/runs/$RUN_ID" --arg description "$DESCRIPTION" '{state:$state,target_url:$target_url,description:$description,context:"zhituo/ci-gate"}')"
          test "$STATE" = success
