name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATA_BACKEND: database
      DATABASE_URL: postgresql+psycopg://zhituo:zhituo@127.0.0.1:5432/zhituo
      DATABASE_RLS_ENABLED: "true"
      JOB_MODE: queue
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_MODE: "true"
      ALLOW_DEMO_FALLBACK: "true"
      AUTH_MODE: development_header
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhituo
          POSTGRES_USER: zhituo
          POSTGRES_PASSWORD: zhituo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhituo -d zhituo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify dependency graph
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Validate operations shell scripts
        run: bash -n ../../ops/postgres/backup.sh ../../ops/postgres/restore.sh
      - name: Apply database migrations on clean PostgreSQL
        run: alembic upgrade head
      - name: Verify latest migration downgrade and re-upgrade
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Provision and verify least-privilege database roles
        env:
          PGPASSWORD: zhituo
        run: |
          psql -h 127.0.0.1 -U zhituo -d zhituo \
            --set=database_name=zhituo \
            --set=runtime_role=zhituo_ci_runtime \
            --set=runtime_password='ci-runtime-password-123456789' \
            --set=backup_role=zhituo_ci_backup \
            --set=backup_password='ci-backup-password-123456789' \
            -f ../../ops/postgres/provision_runtime_role.sql
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='zhituo_ci_runtime'")" = "f"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='zhituo_ci_backup'")" = "t"
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo -Atc "SELECT has_table_privilege('zhituo_ci_backup','opportunities','INSERT')")" = "f"
      - name: Verify Redis connectivity
        run: python -c "from redis import Redis; assert Redis.from_url('redis://127.0.0.1:6379/0').ping()"
      - name: Run unit, integration and PostgreSQL RLS tests
        run: pytest -q
      - name: Verify repeatable demo seed and CLI
        run: |
          zhituo-api reset-demo
          zhituo-api status
      - name: Exercise PostgreSQL backup and restore to isolated database
        env:
          PGPASSWORD: zhituo
        run: |
          rm -rf /tmp/zhituo-backup-ci
          DATABASE_URL='postgresql://zhituo:zhituo@127.0.0.1:5432/zhituo' \
            BACKUP_DIR=/tmp/zhituo-backup-ci \
            RETENTION_DAYS=0 \
            bash ../../ops/postgres/backup.sh
          BACKUP_FILE="$(find /tmp/zhituo-backup-ci -name 'zhituo-*.dump' -type f | head -n 1)"
          test -n "$BACKUP_FILE"
          dropdb --if-exists -h 127.0.0.1 -U zhituo zhituo_restore_ci
          createdb -h 127.0.0.1 -U zhituo zhituo_restore_ci
          TARGET_DATABASE_URL='postgresql://zhituo:zhituo@127.0.0.1:5432/zhituo_restore_ci' \
            BACKUP_FILE="$BACKUP_FILE" \
            CONFIRM_RESTORE=YES \
            bash ../../ops/postgres/restore.sh
          test "$(psql -h 127.0.0.1 -U zhituo -d zhituo_restore_ci -Atc 'SELECT count(*) FROM opportunities')" -gt 0

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API production image
        run: docker build --pull -t zhituo-api:ci apps/api
      - name: Smoke import API production image
        run: docker run --rm --entrypoint python zhituo-api:ci -c "import app.main; print('api-import-ok')"
      - name: Build Web production image
        run: docker build --pull -t zhituo-web:ci apps/web
