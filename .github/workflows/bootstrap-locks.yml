name: Bootstrap Dependency Locks

on:
  push:
    branches: [feat/production-alpha-connectors]

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm workspace lock
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Python uv lock
        run: |
          python -m pip install --upgrade pip
          pip install 'uv>=0.8,<1'
          cd apps/api
          uv lock
      - name: Commit locks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json apps/api/uv.lock
          if git diff --cached --quiet; then
            echo 'Dependency locks already current'
            exit 0
          fi
          git commit -m 'build: lock application dependencies [lock-bootstrap]'
          git push origin HEAD:${{ github.ref_name }}
