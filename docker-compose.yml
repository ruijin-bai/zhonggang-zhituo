services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zhituo
      POSTGRES_USER: zhituo
      POSTGRES_PASSWORD: zhituo
    ports:
      - "5432:5432"
    volumes:
      - zhituo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhituo -d zhituo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zhituo_pgdata:
