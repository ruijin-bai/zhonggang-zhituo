[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhituo-api"
version = "0.12.0"
description = "Zhonggang Zhituo market intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "celery[redis]>=5.6.2,<5.7",
  "redis>=5.3,<6.5",
  "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
zhituo-api = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
